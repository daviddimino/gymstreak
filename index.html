  :root{
    --bg:#0B0B0D; --card:#151518; --raise:#1C1C21; --raise2:#242429;
    --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
    --lime:#D4FF3F; --lime-ink:#0B0B0D;
    --t1:#F6F6F8; --t2:#9B9BA4; --t3:#66666E;
    --up:#3BE384; --down:#FF5D63;
    --gold:#F5C044; --silver:#C7CBD1; --bronze:#C98B54;
    --stat:"Barlow Condensed","Oswald","Arial Narrow",system-ui,sans-serif;
    --body:"DM Sans",-apple-system,system-ui,"Segoe UI",sans-serif;
    --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --r:16px;
    --top-inset:60px; /* cleared above the fake status bar; overridden with safe-area in app build */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:var(--body); color:var(--t1);
    background:
      radial-gradient(120% 80% at 50% -10%, #17170c 0%, rgba(23,23,12,0) 46%),
      radial-gradient(90% 60% at 50% 120%, #101014 0%, rgba(16,16,20,0) 55%),
      #050506;
    min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:36px 16px 130px;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--lime);color:#0B0B0D}

  /* ---------- studio header ---------- */
  .studio{width:100%;max-width:900px;text-align:center;margin-bottom:30px}
  .studio .mark{
    display:inline-flex;align-items:center;gap:9px;font-family:var(--stat);
    font-weight:800;letter-spacing:-.04em;font-size:23px;
  }
  .studio .mark b{color:var(--lime)}
  .studio .mark .dot{width:9px;height:9px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}
  .studio p{color:var(--t2);font-size:13px;margin-top:9px;letter-spacing:.01em}

  /* ---------- phone frame ---------- */
  .phone{
    width:390px;height:844px;position:relative;border-radius:52px;
    background:var(--bg);
    border:1px solid var(--line2);
    box-shadow:0 0 0 11px #131316, 0 0 0 12px #29292e, 0 40px 90px -30px rgba(0,0,0,.9);
    overflow:hidden;
  }
  .island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:118px;height:35px;background:#000;border-radius:20px;z-index:60;
  }
  .status{
    position:absolute;top:0;left:0;right:0;height:54px;z-index:55;
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 30px 0;font-size:14px;font-weight:600;
    font-variant-numeric:tabular-nums;pointer-events:none;
  }
  .status .rt{display:flex;gap:7px;align-items:center}
  .status svg{display:block}

  /* ---------- viewport / screens ---------- */
  .viewport{position:absolute;inset:0;overflow:hidden}
  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;
    animation:fade .28s ease both;
  }
  .screen.active{display:flex}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:64px 20px 22px}
  .scroll::-webkit-scrollbar{width:0}
  .has-tab .scroll{padding-bottom:104px}

  /* ---------- typographic helpers ---------- */
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);font-weight:800}
  .h1{font-family:var(--stat);font-weight:900;letter-spacing:-.02em;font-size:28px;line-height:1.02}
  .sub{color:var(--t2);font-size:14px;line-height:1.45}
  .font-display{font-family:var(--stat)}
  .font-mono-data{font-family:var(--mono)}
  .stat-num{font-family:var(--stat);font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:.9}
  .muted{color:var(--t2)}
  .tny{font-size:12px}

  /* ---------- buttons ---------- */
  .btn{
    display:flex;align-items:center;justify-content:center;gap:9px;
    height:56px;border-radius:16px;border:none;width:100%;cursor:pointer;
    font-family:var(--stat);font-weight:800;font-size:16.5px;letter-spacing:-.01em;
  }
  .btn-primary{background:var(--lime);color:var(--lime-ink);box-shadow:0 10px 30px -12px rgba(212,255,63,.6)}
  .btn-primary:disabled{background:var(--raise2);color:var(--t3);box-shadow:none;cursor:default}
  .btn-primary:active{transform:translateY(1px)}
  .btn-ghost{background:transparent;color:var(--t1);border:1px solid var(--line2)}
  .btn-dark{background:var(--raise);color:var(--t1);border:1px solid var(--line)}
  .btn-sm{height:40px;font-size:13.5px;border-radius:12px;width:auto;padding:0 16px;font-weight:600}

  /* ---------- cards ---------- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
  .row{display:flex;align-items:center;gap:12px}
  .between{display:flex;align-items:center;justify-content:space-between}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* ---------- avatar w/ live ring ---------- */
  .av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center;
      font-family:var(--stat);font-weight:800;color:#0B0B0D;letter-spacing:-.02em}
  .av.live::after{
    content:"";position:absolute;inset:-4px;border-radius:50%;
    border:2px solid var(--lime);animation:pulse 2s ease-out infinite;
  }
  .av .ping{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;
    background:var(--lime);border:2.5px solid var(--card)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,255,63,.5)}70%{box-shadow:0 0 0 9px rgba(212,255,63,0)}100%{box-shadow:0 0 0 0 rgba(212,255,63,0)}}

  /* ---------- chips ---------- */
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chips::-webkit-scrollbar{height:0}
  .chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);
    background:var(--card);color:var(--t2);font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer}
  /* selected chip = thin lime outline + lime text on transparent (accent marks the user, not chrome) */
  .chip.on{background:transparent;color:var(--lime);border-color:var(--lime)}
  .chip:focus{outline:none}
  .chip:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

  /* ---------- tab bar ---------- */
  .tabbar{
    position:absolute;left:0;right:0;bottom:0;height:88px;z-index:40;
    background:linear-gradient(to top,rgba(11,11,13,.98) 55%,rgba(11,11,13,0));
    display:flex;align-items:flex-start;padding:12px 14px 0;
    border-top:1px solid var(--line);backdrop-filter:blur(12px);
  }
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:none;
    color:var(--t3);font-size:10.5px;font-weight:600;cursor:pointer;padding-top:4px}
  .tab.on{color:var(--lime)}
  .tab svg{width:24px;height:24px}

  /* ---------- week strip ---------- */
  .week{display:flex;justify-content:space-between;gap:6px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px}
  .day .lab{font-size:12px;color:var(--t3);font-weight:800}
  .day .cell{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
  .day.hit .cell{background:var(--lime);border-color:var(--lime)}
  .day.today .cell{border-color:var(--lime)}
  .day.today .lab{color:var(--lime)}
  .day.hit .lab{color:var(--t1)}

  /* home brand bar */
  .logo-mark{width:36px;height:36px;flex:none;border-radius:11px;background:var(--lime);display:grid;place-items:center}
  .logo-mark svg{width:21px;height:21px;color:#0B0B0D}
  .wordmark{font-family:var(--stat);font-weight:900;font-size:22px;letter-spacing:-.02em}
  .iconbtn{width:42px;height:42px;flex:none;border-radius:13px;background:var(--card);border:1px solid var(--line);
    display:grid;place-items:center;color:var(--t1);cursor:pointer;position:relative}
  .iconbtn svg{width:21px;height:21px}
  .dot-badge{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:50%;background:var(--lime);border:2px solid var(--card)}
  /* streak hero */
  .week-box{flex:none;text-align:center;border:1.5px solid var(--lime);border-radius:18px;padding:14px 18px;
    background:rgba(212,255,63,.06)}
  .streak-glow{position:absolute;right:-40px;top:-40px;width:200px;height:200px;
    background:radial-gradient(circle,rgba(212,255,63,.16),transparent 68%);pointer-events:none}

  /* ---------- rank row ---------- */
  .rank{display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;border:1px solid transparent}
  .rank .pos{width:22px;text-align:center;font-family:var(--stat);font-weight:800;font-size:16px;color:var(--t2);font-variant-numeric:tabular-nums}
  .rank .nm{flex:1;min-width:0}
  .rank .nm b{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank .nm span{font-size:12px;color:var(--t3)}
  .rank .val{font-family:var(--stat);font-weight:800;font-size:19px;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
  .rank.me{background:rgba(212,255,63,.09);border-color:rgba(212,255,63,.35)}
  .rank .trend{font-size:11px;font-weight:700;display:flex;align-items:center;gap:2px}
  .up{color:var(--up)}.dn{color:var(--down)}

  /* leaderboard audience dropdown (Friends / Groups / …) */
  .lb-aud-wrap{position:relative;flex:none}
  .lb-aud{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px 0 12px;border-radius:10px;
    background:var(--raise);border:1px solid var(--line);color:var(--t1);font-family:var(--stat);font-weight:700;font-size:14.5px;cursor:pointer}
  .lb-aud svg{color:var(--t2)}
  .lb-aud:focus{outline:none}.lb-aud:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
  .lb-audmenu{position:absolute;top:calc(100% + 6px);left:0;min-width:150px;background:var(--card);border:1px solid var(--line2);
    border-radius:12px;padding:6px;display:none;flex-direction:column;gap:2px;z-index:30;box-shadow:0 16px 40px -12px #000}
  .lb-audmenu.open{display:flex}
  .lb-audmenu button{text-align:left;height:40px;padding:0 12px;border-radius:8px;border:none;background:none;
    color:var(--t1);font-family:var(--body);font-weight:600;font-size:14.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
  .lb-audmenu button.on{color:var(--lime)}
  .lb-audmenu button.on::after{content:"✓"}
  /* pinned self row when it scrolls out of the list (opaque backdrop, keeps the .me lime tint) */
  .lb-pinned{position:sticky;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:5;margin-top:12px;
    background:var(--bg);border-radius:15px;box-shadow:0 12px 30px -8px #000}
  .lb-pinned .rank{border:1px solid rgba(212,255,63,.55)}
  /* group cards + opened-group header */
  .group-emblem{width:52px;height:52px;flex:none;border-radius:15px;display:grid;place-items:center;
    font-family:var(--stat);font-weight:800;font-size:19px;color:#0B0B0D}
  .group-emblem.sm{width:40px;height:40px;border-radius:12px;font-size:15px}
  .group-card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px;margin-bottom:12px;
    border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,transform .1s}
  .group-card:active{transform:scale(.99)}
  .group-card>div>b{display:block;font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .group-card .stack{display:flex;margin-top:9px}
  .group-card .stack span{margin-left:-9px}
  .group-card .stack span:first-child{margin-left:0}
  .group-card .stack .av{box-shadow:0 0 0 2px var(--card)}
  .group-meta{display:flex;align-items:center;gap:6px;flex:none}
  .group-meta .grk{text-align:right}
  .group-meta .grk b{font-family:var(--stat);font-weight:800;font-size:19px;display:block;line-height:1}
  .group-meta .grk span{font-size:9.5px;color:var(--t3);text-transform:uppercase;letter-spacing:.08em}
  .group-meta svg{color:var(--t3)}
  .lb-grouphead{display:flex;align-items:center;gap:12px;margin-top:12px}
  .lb-grouphead b{font-size:16px;font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* podium */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:12px;padding:6px 0 4px}
  .pod{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1}
  .pod .plat{width:100%;border-radius:14px 14px 0 0;border:1px solid var(--line);border-bottom:none;
    background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:12px 6px;text-align:center}
  .pod.p1 .plat{height:112px;background:linear-gradient(180deg,rgba(212,255,63,.16),rgba(212,255,63,.03));border-color:rgba(212,255,63,.4)}
  .pod.p2 .plat{height:88px}.pod.p3 .plat{height:74px}
  .pod .medal{font-family:var(--stat);font-weight:800;font-size:15px}
  .pod .pv{font-family:var(--stat);font-weight:800;font-size:16px;letter-spacing:-.03em;margin-top:2px}
  .pod .pn{font-size:12px;color:var(--t2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  /* heatmap */
  .heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
  .heat i{aspect-ratio:1;border-radius:3px;background:var(--raise)}
  .heat i.l1{background:rgba(212,255,63,.28)}
  .heat i.l2{background:rgba(212,255,63,.55)}
  .heat i.l3{background:var(--lime)}

  /* toggle switch */
  .sw{width:46px;height:28px;border-radius:999px;background:var(--raise2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;transition:.2s}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .sw.on{background:var(--lime);border-color:var(--lime)}
  .sw.on::after{left:20px}

  /* misc */
  .divider{height:1px;background:var(--line);margin:4px 0}
  .pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700}
  .pill-live{background:rgba(212,255,63,.14);color:var(--lime)}
  .flame{color:var(--lime)}
  .empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding:40px 24px;color:var(--t2)}
  .empty .ico{width:66px;height:66px;border-radius:20px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
  .empty .ico svg{width:30px;height:30px}

  /* ---------- onboarding (frozen header + footer, scrollable list) ---------- */
  .ob{flex:1;min-height:0;display:flex;flex-direction:column}
  .ob-head{flex:none;padding:var(--top-inset) 20px 14px;background:var(--bg);z-index:5;
    border-bottom:1px solid transparent;transition:border-color .2s}
  .ob-head.scrolled{border-bottom-color:var(--line)}
  .ob-list{flex:1;min-height:0;overflow-y:auto;padding:8px 20px 22px}
  .ob-list::-webkit-scrollbar{width:0}
  .ob-foot{flex:none;padding:14px 20px calc(24px + env(safe-area-inset-bottom,0px));
    background:linear-gradient(to top,var(--bg) 74%,transparent)}
  .searchbar{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 14px;margin-top:16px;
    border-radius:14px;background:var(--raise);border:1px solid var(--line);transition:border-color .15s}
  .searchbar:focus-within{border-color:var(--line2)}
  .searchbar svg{flex:none;color:var(--t3)}
  .searchbar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--t1);
    font-family:var(--body);font-size:16px;caret-color:var(--lime)}
  .searchbar input::placeholder{color:var(--t3)}
  .searchbar .clr{display:none;width:30px;height:30px;flex:none;border:none;border-radius:8px;cursor:pointer;
    background:var(--raise2);color:var(--t2);font-size:13px}
  .searchbar.has-val .clr{display:block}
  .gcount{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);font-weight:700;margin:6px 2px 12px}
  .gymrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:12px;margin-bottom:10px;
    border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;
    transition:border-color .15s,background .15s,transform .1s}
  .gymrow:active{transform:scale(.99)}
  .gymrow .thumb{width:56px;height:56px;flex:none;border-radius:13px;overflow:hidden;background:var(--raise)}
  .gymrow .ginfo{flex:1;min-width:0}
  .gymrow .ginfo b{display:block;font-size:15.5px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gymrow .ginfo .adr{font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .gymrow .ginfo .dist{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--t3);font-weight:600;margin-top:7px}
  .gymrow .radio{width:24px;height:24px;flex:none;border-radius:50%;border:2px solid var(--line2);
    display:grid;place-items:center;transition:.15s}
  .gymrow .radio svg{opacity:0;transition:opacity .12s}
  .gymrow.sel{border-color:var(--lime);background:rgba(212,255,63,.06)}
  .gymrow.sel .radio{background:var(--lime);border-color:var(--lime)}
  .gymrow.sel .radio svg{opacity:1}
  .gymrow.hidden{display:none}
  .gym-empty{text-align:center;color:var(--t2);padding:34px 20px;font-size:13.5px;line-height:1.5}
  .gym-empty b{color:var(--t1);display:block;margin-bottom:6px;font-size:15px}
  /* skeleton loading rows — same footprint as a .gymrow so the list fills in, not jumps */
  .gymrow.skel{cursor:default;pointer-events:none}
  .sk{display:block;border-radius:8px;background:linear-gradient(100deg,var(--raise) 30%,var(--raise2) 50%,var(--raise) 70%);
    background-size:200% 100%;animation:sk 1.2s ease-in-out infinite}
  .gymrow .thumb.sk{width:56px;height:56px;border-radius:13px}
  .sk-l1{width:56%;height:15px;margin-bottom:9px}
  .sk-l2{width:78%;height:12px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* list-state panels: empty / error / location-denied / location-failed */
  .gym-state{text-align:center;color:var(--t2);padding:30px 18px 8px;font-size:13.5px;line-height:1.5}
  .gym-state b{color:var(--t1);display:block;margin-bottom:6px;font-size:15.5px}
  .gym-state p{margin:0 auto;max-width:280px}
  .gym-retry{display:inline-flex;align-items:center;gap:7px;margin-top:16px;height:44px;padding:0 18px;border-radius:12px;
    background:var(--lime);border:none;color:#0B0B0D;font-family:var(--stat);font-weight:800;font-size:15px;cursor:pointer}
  .gym-retry svg{color:#0B0B0D}
  /* controls row: multi-select toggle + map button */
  .ob-controls{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .multi-toggle{display:flex;align-items:center;gap:11px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--t2)}
  .multi-toggle .sw{transform:scale(.82);transform-origin:left center}
  .map-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 16px 0 13px;border-radius:12px;
    background:var(--raise);border:1px solid var(--line);color:var(--t1);font-family:var(--body);font-weight:600;font-size:14px;cursor:pointer}
  .map-btn svg{color:var(--lime)}
  .ob-list.multi .gymrow .radio{border-radius:8px}
  /* map picker overlay */
  .ob-map{position:absolute;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
  .ob-map.open{display:flex}
  .obm-head{flex:none;display:flex;align-items:center;gap:13px;padding:var(--top-inset) 20px 13px;border-bottom:1px solid var(--line)}
  .obm-head .ttl{flex:1;min-width:0}
  .obm-head .ttl b{display:block;font-size:17px;font-weight:700}
  .obm-head .ttl span{font-size:12px;color:var(--t2)}
  .mapwrap{flex:1;position:relative;overflow:hidden;background:#0e1013}
  .mapwrap svg.base{position:absolute;inset:0;width:100%;height:100%}
  .map-badge{position:absolute;left:46%;top:60%;transform:translate(6px,-26px);font-size:10.5px;font-weight:700;
    color:#9cc2ff;background:rgba(11,11,13,.72);padding:2px 7px;border-radius:6px;pointer-events:none;z-index:2}
  .you-dot{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;
    background:#5EA0FF;border:3px solid #0B0B0D;box-shadow:0 0 0 4px rgba(94,160,255,.22);z-index:1}
  .pin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:4px;
    background:none;border:none;cursor:pointer;z-index:2;padding:0}
  .pin .mk{width:30px;height:30px;border-radius:50% 50% 50% 2px;transform:rotate(45deg);
    background:var(--card);border:1.5px solid var(--line2);display:grid;place-items:center;transition:.15s;box-shadow:0 4px 12px rgba(0,0,0,.5)}
  .pin .mk i{width:9px;height:9px;border-radius:50%;background:var(--t2);transform:rotate(-45deg);transition:.15s}
  .pin .lab{font-size:10.5px;font-weight:700;color:var(--t2);background:rgba(11,11,13,.72);
    padding:1px 6px;border-radius:6px;white-space:nowrap;transition:.15s}
  .pin.on{z-index:6}
  .pin.on .mk{background:var(--lime);border-color:var(--lime);transform:rotate(45deg) scale(1.14)}
  .pin.on .mk i{background:#0B0B0D;width:11px;height:11px}
  .pin.on .lab{color:#0B0B0D;background:var(--lime)}
  .obm-foot{flex:none;display:flex;align-items:center;gap:14px;background:var(--bg);border-top:1px solid var(--line);
    padding:14px 20px calc(18px + env(safe-area-inset-bottom,0px))}
  .obm-foot .cnt{flex:1;font-size:14px;color:var(--t2);font-weight:600}
  .obm-foot .cnt b{color:var(--t1)}
  /* onboarding 3-step flow */
  .ob-prog{display:flex;flex-direction:column;gap:8px}
  .ob-bars{display:flex;gap:6px}
  .ob-bars span{flex:1;height:4px;border-radius:999px;background:var(--line2);transition:background .25s}
  .ob-bars span.on{background:var(--lime)}
  .ob-body{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 22px;display:flex;flex-direction:column}
  .ob-body::-webkit-scrollbar{width:0}
  .ob-center{align-items:center;text-align:center;justify-content:center}
  .ob-hero{width:78px;height:78px;border-radius:24px;background:var(--lime);display:grid;place-items:center;box-shadow:0 14px 40px -12px rgba(212,255,63,.55)}
  .ob-hero svg{width:40px;height:40px;color:#0B0B0D}
  .ob-value{display:flex;flex-direction:column;gap:14px;margin-top:30px;width:100%;max-width:320px;text-align:left}
  .ob-value-row{display:flex;gap:13px;align-items:center}
  .ob-value-row .vi{font-size:20px;width:26px;text-align:center;flex:none}
  .ob-value-row b{display:block;font-size:15px;font-weight:700}
  .ob-value-row span{font-size:13px;color:var(--t2)}
  .ob-devswitch{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px;font-size:11px;color:var(--t3)}

  btn.disabled=true; btn.textContent='Requesting…';
  const {state,coords}=await requestLocation();  // never fired without this priming screen
  onbLocState=state; onbLocGranted=(state==='granted'); onbCoords=coords;
  onbStep=2; onbRender();
}
// Retry the location fix from the 'locfail' path (permission was granted, fix failed).
async function retryLocation(){
  const {state,coords}=await requestLocation();
  onbLocState=state; onbLocGranted=(state==='granted'); onbCoords=coords;
  onbGymsCache=null;                             // force a fresh nearby fetch if we now have coords
  onbRender();
}
function onbBack(){ if(onbStep>1){ onbStep--; onbRender(); } }
function onbRender(){
  const scr=document.querySelector('.screen');
  if(!scr) return;
  scr.innerHTML=S.onboard();
  if(onbStep===2){                               // (re)entering the gym step
    onbSearchQuery='';                           // fresh input each render
    clearTimeout(onbSearchTimer);
    if(onbSearchAbort){ onbSearchAbort.abort(); onbSearchAbort=null; }
    loadInitialGyms();                           // paints skeletons → results (or the right no-coords state)
  }
  setDevBadge();
}

// ---- gym-list state (session-scoped) ----
let onbGyms=[];              // rows currently shown
let onbListState='idle';     // loading | loaded | empty | error | denied | locfail
let onbGymsCache=null;       // cached initial nearby results — survives back/forward, no refetch
let onbGymsById=new Map();   // id -> gym, so selection resolves across list swaps (nearby ↔ search)
let onbSearchQuery='';
let onbSearchTimer=null;
let onbSearchAbort=null;

// Initial list for step 2: nearby search when we have coords, otherwise the matching no-coords state.
async function loadInitialGyms(){
  if(onbLocState==='denied'||onbLocState==='unavailable'){ onbListState='denied'; renderGymList(); return; }
  if(onbLocState==='locfail'||!onbCoords){ onbListState='locfail'; renderGymList(); return; }
  if(onbGymsCache){ onbGyms=onbGymsCache; onbListState=onbGymsCache.length?'loaded':'empty'; renderGymList(); return; }
  onbListState='loading'; renderGymList();
  try{
    const gyms=await fetchGyms({mode:'nearby',lat:onbCoords.lat,lng:onbCoords.lng});
    onbGymsCache=gyms; onbGyms=gyms; onbListState=gyms.length?'loaded':'empty';
  }catch(e){ onbListState='error'; }             // visible failure — never fall back to mock data
  renderGymList();
}

// Search box → text-search endpoint, debounced 300ms, in-flight request cancelled on each new keystroke.
function onSearchInput(v){
  onbSearchQuery=v.trim();
  document.getElementById('searchbar').classList.toggle('has-val', onbSearchQuery.length>0);
  clearTimeout(onbSearchTimer);
  if(!onbSearchQuery){ restoreLocationView(); return; }   // cleared → back to the location-based list
  onbSearchTimer=setTimeout(runSearch,300);
}
async function runSearch(){
  if(onbSearchAbort) onbSearchAbort.abort();
  onbSearchAbort=new AbortController();
  onbListState='loading'; renderGymList();
  try{
    const payload={mode:'search',query:onbSearchQuery};
    if(onbCoords){ payload.lat=onbCoords.lat; payload.lng=onbCoords.lng; }  // distances only when we know where the user is
    const gyms=await fetchGyms(payload,onbSearchAbort.signal);
    onbGyms=gyms; onbListState=gyms.length?'loaded':'empty'; renderGymList();
  }catch(e){
    if(e.name==='AbortError') return;            // superseded by a newer keystroke
    onbListState='error'; renderGymList();
  }
}
function restoreLocationView(){
  if(onbSearchAbort){ onbSearchAbort.abort(); onbSearchAbort=null; }
  loadInitialGyms();
}
function retryGyms(){ if(onbSearchQuery) runSearch(); else { onbGymsCache=null; loadInitialGyms(); } }

function renderGymList(){
  const list=document.getElementById('obList'); if(!list) return;
  const st=onbListState, searching=!!onbSearchQuery, showDist=(onbLocState==='granted');
  const rows=gyms=>gyms.map((g,i)=>{ onbGymsById.set(g.id,g); return `
    <button class="gymrow" data-id="${obEsc(g.id)}" onclick="toggleGym(this.dataset.id)">
      <div class="thumb">${mapThumb(i)}</div>
      <div class="ginfo">
        <b>${obEsc(g.name)}</b>
        <div class="adr">${obEsc(g.address)}</div>
        ${showDist&&g.distance_mi!=null?`<div class="dist">${I.pin}${g.distance_mi.toFixed(1)} mi away</div>`:''}
      </div>
      <div class="radio">${CHECK14}</div>
    </button>`; }).join('');

  // count header — hidden entirely when we have no coordinates (denied/unavailable)
  let count='';
  if(searching){ if(st==='loaded') count=`${onbGyms.length} match${onbGyms.length===1?'':'es'}`; }
  else if(onbLocState==='granted'&&st==='loaded'){ count=`${onbGyms.length} gym${onbGyms.length===1?'':'s'} near you`; }
  const countHTML = count ? `<div class="gcount">${count}</div>` : '';

  let body='';
  if(st==='loading'){
    body=Array.from({length:6}).map(()=>`
      <div class="gymrow skel">
        <div class="thumb sk"></div>
        <div class="ginfo"><span class="sk sk-l1"></span><span class="sk sk-l2"></span></div>
        <div class="radio" style="border-color:var(--line)"></div>
      </div>`).join('');
  } else if(st==='error'){
    body=`<div class="gym-state"><b>Couldn’t load gyms</b>
      <p>Something went wrong reaching gym search. Check your connection and try again.</p>
      <button class="gym-retry" onclick="retryGyms()">${I.pin}Try again</button></div>`;
  } else if(st==='loaded'){
    body=rows(onbGyms);
  } else if(st==='empty'){
    body=searching
      ? `<div class="gym-state"><b>No gyms match “${obEsc(onbSearchQuery)}”</b><p>Try a different name.</p></div>`
      : `<div class="gym-state"><b>No gyms found nearby</b><p>Nothing within a few miles. Search for your gym by name above.</p></div>`;
  } else if(st==='denied'){
    body=`<div class="gym-state"><b>Search for your gym</b>
      <p>Location is off, so we can’t sort by distance. Type your gym’s name in the search box above.</p></div>`;
  } else if(st==='locfail'){
    body=`<div class="gym-state"><b>Couldn’t pin your location</b>
      <p>We had permission but couldn’t get a fix. Retry, or search for your gym by name above.</p>
      <button class="gym-retry" onclick="retryLocation()">${I.pin}Retry location</button></div>`;
  }
  const showManual = ['loaded','empty','denied','locfail'].includes(st);
  const manual = showManual
    ? `<p class="muted tny" style="text-align:center;margin:14px 0 4px">Don’t see your gym? <span style="color:var(--lime);font-weight:600">Add it manually</span></p>` : '';
  list.innerHTML = countHTML + body + manual;
  syncGymUI();                                   // re-apply selection highlight to the fresh rows
}

  v=v.trim().toLowerCase().replace(/^@+/,'').replace(/[^a-z0-9_]/g,'');

  h.textContent = taken ? `@${v} is taken — try another` : `@${v} is available`;

];

function groupRank(g){
  const ranked=LBF.filter(f=>g.members.includes(f.k)).map(f=>({f,v:lbValue(f)})).sort((a,b)=>b.v.n-a.v.n);
  const i=ranked.findIndex(r=>r.f.k==='you');
  return i>=0 ? i+1 : null;
}
function groupCard(g){

}
const fmtMin=min=>Math.floor(min/60)+'h '+String(min%60).padStart(2,'0')+'m';
/* leaderboard is always weekly; Streak shows the all-time streak */
function lbValue(f){
  if(lbMetric==='streak')   return {n:f.streak, disp:f.streak+'d'};   // all-time
  if(lbMetric==='sessions') return {n:f.w[1],   disp:''+f.w[1]};      // this week
  return {n:f.w[0], disp:fmtMin(f.w[0])};                             // this week total time
}
function setLbMetric(m){ lbMetric=m; renderBoard(); }
let lbPinObs=null;
function teardownPin(){ if(lbPinObs){lbPinObs.disconnect();lbPinObs=null;} const p=document.getElementById('lbPinned'); if(p){p.style.display='none';p.innerHTML='';} }
function setupPin(ranked){
  teardownPin();
  const idx=ranked.findIndex(r=>r.f.k==='you'); if(idx<0) return;
  const pinned=document.getElementById('lbPinned'), scroller=document.querySelector('.scr-body');
  const realRow=[...document.querySelectorAll('#lbContent .rank.me')][0];
  if(!pinned||!scroller||!realRow) return;
  pinned.innerHTML=lbRow(idx+1, ranked[idx].f, ranked[idx].v.disp);   // reuses the shared .rank.me highlight
  lbPinObs=new IntersectionObserver(es=>{ pinned.style.display = es[0].isIntersecting ? 'none':'block'; },{root:scroller,threshold:0.6});
  lbPinObs.observe(realRow);
}
function renderBoard(){
  const content=document.getElementById('lbContent'); if(!content) return;
  document.querySelectorAll('#lbChips .chip').forEach(c=>c.classList.toggle('on',c.dataset.m===lbMetric));
  // groups audience, no group opened → tappable group list
  if(lbTab==='groups' && !lbGroup){ content.innerHTML=GROUPS.map(groupCard).join(''); teardownPin(); return; }
  const g=lbGroup?groupById(lbGroup):null;
  const pool=g?LBF.filter(f=>g.members.includes(f.k)):LBF;
  const ranked=pool.map(f=>({f,v:lbValue(f)})).sort((a,b)=>b.v.n-a.v.n);
  const showPodium=ranked.length>=6;   // a 3-person podium is meaningless with few participants
  const t=ranked.slice(0,3);
  const podium=showPodium?`<div class="podium">${podCol(t[1],2)}${podCol(t[0],1)}${podCol(t[2],3)}</div>`:'';
  const rows=ranked.map((r,i)=>lbRow(i+1,r.f,r.v.disp)).join('<div class="divider" style="margin:0 12px"></div>');
  content.innerHTML = podium + `<div class="card" style="padding:6px;margin-top:${showPodium?'14px':'2px'}">${rows}</div>`;
  setupPin(ranked);   // pin the user's row to the bottom when it scrolls out of view
}
function podCol(e,rank){
  const cls={1:'p1',2:'p2',3:'p3'}[rank], col={1:'var(--lime)',2:'var(--silver)',3:'var(--bronze)'}[rank];

      <div class="pv"${rank===1?' style="color:var(--lime)"':''}>${e.v.disp}</div></div>

}

  ['friendsEmpty','Empty · Friends',false],
];
const vp=document.getElementById('viewport');
const dock=document.getElementById('dock');
const phone=document.getElementById('phone');
let current='onboard';

/* ---- dev-only screen badge: shows which S.<screen> builder this page is (disable with ?dev=0) ---- */
const DEV = new URLSearchParams(location.search).get('dev') !== '0';
const DEV_CORNERS=['b-br','b-bl','b-tr','b-tl']; let devCorner=0;
function setDevBadge(){
  const b=document.getElementById('devBadge'); if(!b) return;
  if(!DEV){ b.style.display='none'; return; }
  const mapOpen=document.getElementById('obMap')?.classList.contains('open');
  b.textContent = 'S.'+current + (mapOpen?' › map':'');
  b.className=DEV_CORNERS[devCorner];
  b.style.display='block';
}
function cycleDevBadge(){ devCorner=(devCorner+1)%DEV_CORNERS.length; setDevBadge(); }

let profileReturn='home';
function openProfile(){ if(current!=='profile') profileReturn=current; go('profile'); }
const pfpBtn=()=>`<button class="pfp" onclick="openProfile()" title="Your profile">${avatar('you',38)}</button>`;
/* consistent app header: hamburger (top-left) · title · profile avatar (right) */
const menuBtn=()=>`<button class="iconbtn" onclick="openMenu()" title="Menu">${I.menu}</button>`;
const appHeader=(leftInner,mb='0')=>`<div class="between" style="margin-bottom:${mb}">
  <div class="row" style="gap:12px;min-width:0">${menuBtn()}${leftInner}</div>
  ${pfpBtn()}
</div>`;

/* ---- slide-in menu drawer ---- */
function openMenu(){ document.getElementById('menuSheet').classList.add('open'); }
function closeMenu(){ document.getElementById('menuSheet').classList.remove('open'); }
function toast(msg){
  let t=document.getElementById('toast');
  if(!t){ t=document.createElement('div'); t.id='toast'; phone.appendChild(t); }
  t.textContent=msg; t.classList.add('show'); clearTimeout(t._h);
  t._h=setTimeout(()=>t.classList.remove('show'),1600);
}
function menuHTML(){
  const notifs=[
    ['👋','Maya nudged you','“Get to the gym!” · 12m'],
    ['📉','Jordan passed you','Now #1 this week · 1h'],
    ['🔥','7 days to a new record','Keep your 14-day streak alive · 3h'],
    ['🎉','Devon hit an 18-day streak','React in the feed · 5h'],
  ];
  const items=[
    ['🏆','This week’s challenge','Most sessions · you’re 2nd',"closeMenu();toast('Challenge: most sessions — you’re 2nd')"],
    ['🎖️','Achievements','12 badges earned',"closeMenu();toast('12 badges earned')"],
    ['➕','Invite friends','',"closeMenu();go('friends')"],
    ['⚙️','Settings & privacy','',"closeMenu();openProfile()"],
    ['❓','Help & support','',"closeMenu();toast('Help & support')"],
  ];
  return `
  <div class="menu-backdrop" onclick="closeMenu()"></div>
  <div class="menu-panel">
    <div class="menu-head">
      <button class="menu-me" onclick="closeMenu();openProfile()">
        ${avatar('you',46)}
        <div><div style="font-family:var(--stat);font-weight:800;font-size:16px">David DiMino</div>
          <div class="muted tny">🔥 14-day streak · View profile</div></div>
      </button>
      <button class="iconbtn" onclick="closeMenu()" title="Close">✕</button>
    </div>
    <div class="menu-scroll">
      <div class="between" style="margin:2px 0 10px"><div class="eyebrow">Notifications</div><span class="muted tny" style="color:var(--lime);font-weight:700">4 new</span></div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:24px">
        ${notifs.map(n=>`<div class="menu-notif"><span class="ni">${n[0]}</span><div><b>${n[1]}</b><span>${n[2]}</span></div></div>`).join('')}
      </div>
      <div class="eyebrow" style="margin-bottom:8px">Menu</div>
      <div class="menu-list">
        ${items.map(it=>`<button class="menu-item" onclick="${it[3]}"><span class="mi-ico">${it[0]}</span><div class="mi-txt"><b>${it[1]}</b>${it[2]?`<span>${it[2]}</span>`:''}</div>${I.chev}</button>`).join('')}
      </div>
      <button class="btn btn-dark" style="margin-top:22px" onclick="closeMenu();toast('Signed out')">Sign out</button>
      <p class="muted tny" style="text-align:center;margin-top:14px">GymStreak v1.0</p>
    </div>
  </div>`;
}

function go(id){
  current=id;
  const hasTab=['home','board','feed','friends','boardEmpty','friendsEmpty'].includes(id);
  vp.innerHTML=`<div class="screen active ${hasTab?'has-tab':''}">${S[id]()}</div>`;
  document.querySelectorAll('#dock button').forEach(b=>b.classList.toggle('on',b.dataset.s===id));
  wireGym();
  if(id==='board') renderBoard();
  vp.querySelector('.scroll')?.scrollTo(0,0);
  setDevBadge();
}
function onScrollHead(el){ const h=el.parentElement.querySelector('.scr-head'); if(h) h.classList.toggle('stuck', el.scrollTop>4); }
let multiMode=false;
let selectedGyms=new Set();     // holds gym ids (stable across nearby ↔ search list swaps)
function wireGym(){ syncGymUI(); } /* re-apply persisted selection to freshly rendered onboarding */
function toggleGym(id){
  if(selectedGyms.has(id)) selectedGyms.delete(id);      // tap again to deselect (both modes)
  else { if(!multiMode) selectedGyms.clear(); selectedGyms.add(id); }
  syncGymUI();
}
function toggleMulti(){
  multiMode=!multiMode;
  if(!multiMode && selectedGyms.size>1) selectedGyms=new Set([[...selectedGyms][0]]); // collapse to first-selected
  syncGymUI();
}
function syncGymUI(){
  if(!document.getElementById('obList')) return;
  const sw=document.getElementById('multiSw'); if(sw) sw.classList.toggle('on',multiMode);
  document.getElementById('obList').classList.toggle('multi',multiMode);
  document.querySelectorAll('#obList .gymrow').forEach(r=>r.classList.toggle('sel',selectedGyms.has(r.dataset.id)));
  const n=selectedGyms.size, cta=document.getElementById('obCta');
  if(!cta) return;
  if(n===0){ cta.disabled=true; cta.textContent='Select a gym to continue'; }
  else { cta.disabled=false; cta.innerHTML=CHECK14+(n===1?'This is my gym':`Save ${n} gyms`); }
}
function openGymMap(){ document.getElementById('obMap').classList.add('open'); setDevBadge(); }
function closeGymMap(){ document.getElementById('obMap').classList.remove('open'); setDevBadge(); }
function confirmGym(){
  if(!selectedGyms.size) return;
  // multi-select allowed → "home gym" = the first-selected gym; resolve its name from the id map.
  const first=[...selectedGyms][0], g=onbGymsById.get(first);
  onbData.homeGym = g ? g.name : 'your gym';
  onbStep=3; onbRender();
}
function onbHomeGym(){ return onbData.homeGym || 'your gym'; }
function clearGymSearch(){ const i=document.getElementById('gymSearch'); i.value=''; onSearchInput(''); i.focus(); }
function onObScroll(el){ document.getElementById('obHead').classList.toggle('scrolled', el.scrollTop>4); }
function react(btn){
  const c=btn.querySelector('.rc');const on=btn.classList.toggle('reacted');
  c.textContent=+c.textContent+(on?1:-1);
}
function nudge(btn){btn.textContent='✓ Nudged Maya';btn.style.background='var(--raise)';btn.style.color='var(--lime)';setTimeout(()=>{btn.innerHTML='👋 Nudge';btn.style.background='';btn.style.color='';},1600);}

/* build dock */
dock.innerHTML=SCREENS.map(s=>`<button data-s="${s[0]}" onclick="go('${s[0]}')">${s[1]}</button>`).join('');
document.getElementById('menuSheet').innerHTML=menuHTML();

/* reaction button style injected */
const st=document.createElement('style');
st.textContent=`.reactbtn{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:999px;background:var(--raise);border:1px solid var(--line);color:var(--t2);font-size:14px;font-weight:600;cursor:pointer}
.reactbtn.reacted{background:rgba(212,255,63,.14);border-color:rgba(212,255,63,.4);color:var(--lime)}
.reactbtn .rc{font-variant-numeric:tabular-nums}
.dotlive{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 8px var(--lime);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}`;
document.head.appendChild(st);

/* live timer on active screen */
let base=Date.now()-1394*1000;
setInterval(()=>{
  const t=document.getElementById('timer');if(!t)return;
  let s=Math.floor((Date.now()-base)/1000);
  const m=String(Math.floor(s/60)).padStart(2,'0'),ss=String(s%60).padStart(2,'0');
  t.textContent=`${m}:${ss}`;
  const ring=document.getElementById('ring');
  if(ring){const frac=Math.min((s/60)/60,1);ring.setAttribute('stroke-dashoffset',703-703*frac);}
},1000);

go('onboard');
</script>

</body>
</html>
